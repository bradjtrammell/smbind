name: SMBind verification
on:
  push:
    branches: [master, 'rebuild/**', 'feat/**', 'fix/**']
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: pdo_mysql
      - name: Lint PHP
        run: find src public bin tests -type f -name '*.php' -print -exec php -l {} \;
      - name: DNS tests
        run: php tests/run.php
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: local-ci-root-only
          MYSQL_DATABASE: smbind_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -plocal-ci-root-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SMBIND_CI_DATABASE: smbind_ci
      SMBIND_DSN: "mysql:host=127.0.0.1;port=3306;dbname=smbind_ci;charset=utf8mb4"
      SMBIND_DB_USER: root
      SMBIND_DB_PASS: local-ci-root-only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql
          coverage: none
      - name: Install BIND validation utilities
        run: sudo apt-get update -qq && sudo apt-get install -y bind9-utils
      - name: Exercise PDO, real BIND validation, publish, rollback and removal
        run: php tests/integration.php
      - name: Exercise HTTP authentication, CSRF, zone and record CRUD
        run: |
          php -S 127.0.0.1:18080 -t public > /tmp/smbind-http-ci.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 1
          php tests/http.php || { cat /tmp/smbind-http-ci.log; exit 1; }
  css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: test -s public/assets/app.css
      - name: Validate JavaScript syntax
        run: node --check public/assets/app.js
      - name: Package application including compiled styles
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          mkdir -p dist/smbind
          cp -R public src db bin docs ops LICENSE README.md VERSION .env.example dist/smbind/
          test -s dist/smbind/public/assets/app.css
          test -f dist/smbind/public/index.php
          (cd dist && zip -qr "smbind-$version.zip" smbind)
          (cd dist && sha256sum "smbind-$version.zip" > "smbind-$version.zip.sha256")
          unzip -t "dist/smbind-$version.zip" | tail -1
      - name: Upload packaged application and checksum
        uses: actions/upload-artifact@v4
        with:
          name: smbind-compiled-app
          path: |
            dist/smbind-*.zip
            dist/smbind-*.zip.sha256
          if-no-files-found: error
          retention-days: 30

  prerelease:
    name: Publish verified development prerelease
    needs: [php, integration, css]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: smbind-compiled-app
          path: dist
      - name: Validate ZIP checksum and publish versioned prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          tag="v$version"
          (
            cd dist
            sha256sum -c "smbind-$version.zip.sha256"
            unzip -t "smbind-$version.zip" | tail -n 1
          )
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $tag already exists. No files were replaced."
            exit 0
          fi
          gh release create "$tag"             "dist/smbind-$version.zip"             "dist/smbind-$version.zip.sha256"             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "SMBind $version — PHP 8.2+ development prerelease"             --notes "Complete clean-install PHP 8.2+ / PDO MySQL / Tailwind CSS compiled build. Development prerelease: CI validated, not qualified on production BIND. See README and docs/REBUILD_INVENTORY.md."             --prerelease
