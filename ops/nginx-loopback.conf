# SMBind PHP-FPM site, restricted to the local loopback interface by default.
# Adjust the application path and PHP-FPM socket for your host.
# Put HTTPS and IP allow-list rules on the upstream reverse proxy / VPN.
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    root /opt/smbind/current/public;
    index index.php;
    charset utf-8;

    access_log /var/log/nginx/smbind-access.log;
    error_log /var/log/nginx/smbind-error.log warn;
    client_max_body_size 128k;

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_read_timeout 30s;
    }

    location ~ \.php$ { return 404; }
    location ~ /\. { return 404; }

    location / {
        try_files $uri /index.php?$query_string;
    }
}
